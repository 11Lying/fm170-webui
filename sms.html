<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>短信 · FM170</title>
<style>
:root{color-scheme:dark;--bg:#070708;--panel:#101013;--panel-2:#151519;--panel-3:#1a1a1f;--line:#24242a;--line-soft:#1c1c21;--text:#f5f6f7;--muted:#92959d;--subtle:#5c5f68;--good:#34c45f;--good-soft:rgba(52,196,95,.14);--warn:#e8913f;--warn-soft:rgba(232,145,63,.14);--bad:#ef5a5a;--bad-soft:rgba(239,90,90,.14);--radius:8px}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.page{max-width:640px;margin:0 auto;padding:16px 14px 96px}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:54px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.topbar h1{margin:0;font-size:19px;font-weight:720}
.unread-badge{display:inline-flex;align-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--bad-soft);color:var(--bad);font-size:12px;font-weight:800}
.actions{display:flex;gap:8px;margin:12px 0}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);color:var(--text);font-weight:620}
.btn-primary{border-color:#38383f;background:#222227}
.btn-primary:hover{background:#292930}
.btn:disabled{opacity:.55;cursor:not-allowed}
.state{display:block;margin:16px 0;padding:12px 14px;border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--panel-2);color:var(--muted);text-align:center}
.state.error{border-color:rgba(239,90,90,.28);background:var(--bad-soft);color:#ffb0b0}
.sms-list{display:flex;flex-direction:column;gap:8px}
.sms-item{border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--panel-2);overflow:hidden}
.sms-item.unread{border-color:rgba(232,145,63,.4)}
.sms-item-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer}
.sms-sender{font-weight:600;font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sms-status{font-size:13px;font-weight:700;flex:0 0 auto}
.sms-status.unread{color:var(--warn)}
.sms-status.read{color:var(--subtle)}
.sms-time{color:var(--subtle);font-size:13px;flex:0 0 auto;white-space:nowrap}
.sms-preview{padding:0 12px 10px;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sms-detail{border-top:1px solid var(--line-soft);padding:12px}
.sms-detail-row{display:flex;gap:8px;margin-bottom:7px}
.sms-detail-row .k{color:var(--subtle);flex:0 0 52px}
.sms-detail-row .v{color:var(--text);min-width:0;word-break:break-word}
.sms-detail-body{color:var(--text);white-space:pre-wrap;word-break:break-word}
.sms-del{margin:0 12px 10px;color:var(--bad);border-color:rgba(239,90,90,.4);background:var(--bad-soft)}
.sms-empty,.sms-loading{padding:26px 14px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <h1>短信 <span class="unread-badge" id="unread">0</span></h1>
    <button class="btn btn-primary" id="btnRefresh" type="button">刷新短信</button>
  </div>
  <div class="actions">
    <button class="btn" id="btnStatus" type="button">刷新状态</button>
    <button class="btn sms-del" id="btnDelAll" type="button">全部删除</button>
  </div>
  <div id="state"></div>
  <div id="list"></div>
</div>
<script>
const API = "/cgi-bin/fm170_api.cgi";
const $ = s => document.querySelector(s);
let messages = [];
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function setState(msg, cls){ const el=$("#state"); if(!msg){ el.style.display="none"; return; } el.style.display="block"; el.className="state"+(cls?" "+cls:""); el.textContent=msg; }
function isUnread(s){ const u=String(s||"").toUpperCase(); return u==="REC UNREAD" || u==="未读" || u==="UNREAD"; }
function renderUnread(){ const n=messages.filter(m=> isUnread(m.status)).length; $("#unread").textContent=n; }
// 把 GSM 时间 "YY/MM/DD,HH:MM:SS+32" 转成 "YYYY-MM-DD HH:MM"，并去掉时区偏移 +32（无意义）
function fmtTime(s){
  if(!s) return "";
  const t=String(s);
  const m=t.match(/^(\d{2})\/(\d{2})\/(\d{2}),(\d{2}):(\d{2}):(\d{2})/);
  if(!m) return t;
  const yy=2000+(+m[1]), MM=m[2], dd=m[3], hh=m[4], mm=m[5], ss=m[6];
  return yy+"-"+MM+"-"+dd+" "+hh+":"+mm;
}
// 排序用的数值时间戳(便于倒序；解析失败给 -1 排最后)
function timeNum(s){
  if(!s) return -1;
  const m=String(s).match(/^(\d{2})\/(\d{2})\/(\d{2}),(\d{2}):(\d{2}):(\d{2})/);
  if(!m) return -1;
  const yy=2000+(+m[1]);
  return Date.UTC(yy,+m[2]-1,+m[3],+m[4],+m[5],+m[6]);
}
// 状态中文：未读/已读
function stText(s){ return isUnread(s) ? "未读" : "已读"; }
function render(){
  const list=$("#list");
  if(!Array.isArray(messages)){ list.innerHTML='<div class="sms-empty">暂无短信</div>'; renderUnread(); return; }
  if(messages.length===0){ list.innerHTML='<div class="sms-empty">暂无短信</div>'; renderUnread(); return; }
  // 按时间倒序，最新最上；无时间的排最后
  const arr=[...messages].sort((a,b)=> (timeNum(b.datetime)-timeNum(a.datetime)) || (String(a.index).localeCompare(String(b.index))));
  list.innerHTML = arr.map(m=>{
    const unread = isUnread(m.status);
    const st = unread ? '<span class="sms-status unread">未读</span>' : '<span class="sms-status read">已读</span>';
    const t = fmtTime(m.datetime);
    return '<div class="sms-item'+(unread?' unread':'')+'" data-i="'+esc(m.index)+'">'
      +'<div class="sms-item-head">'
      +  '<span class="sms-sender">'+esc(m.sender||"--")+'</span>'+st
      +  '<span class="sms-time">'+esc(t)+'</span>'
      +'</div>'
      +'<div class="sms-preview">'+esc((m.text||"").split("\n")[0]||"")+'</div>'
      +'<div class="sms-detail" hidden>'
      +  '<div class="sms-detail-row"><span class="k">发件人</span><span class="v">'+esc(m.sender||"--")+'</span></div>'
      +  '<div class="sms-detail-row"><span class="k">时间</span><span class="v">'+esc(t)+'</span></div>'
      +  '<div class="sms-detail-row"><span class="k">状态</span><span class="v">'+esc(stText(m.status))+'</span></div>'
      +  '<div class="sms-detail-row"><span class="k">内容</span><div class="sms-detail-body">'+esc(m.text||"--")+'</div></div>'
      +'</div>'
      +'<button class="btn sms-del" type="button" data-del="'+esc(m.index)+'">删除</button>'
      +'</div>';
  }).join("");
  renderUnread();
}
async function loadStatus(){
  setState("正在加载短信...");
  try{
    const r = await fetch(API+"?action=sms_status&ts="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d = await r.json();
    if(!d || d.ok!==true) throw new Error("API 返回异常");
    messages = d.messages||[];
    render();
    setState("");
  }catch(e){ setState("短信服务暂时不可用", "error"); messages=[]; render(); console.error("sms_status", e); }
}
async function doRefresh(){
  const btn=$("#btnRefresh"); btn.disabled=true; setState("正在刷新短信...");
  try{
    const r = await fetch(API+"?action=sms_refresh&ts="+Date.now(), {cache:"no-store"});
    const d = await r.json();
    if(!d || d.ok!==true) throw new Error("刷新失败");
    messages = d.messages||[];
    render(); setState("刷新完成");
  }catch(e){ setState("短信服务暂时不可用", "error"); console.error("sms_refresh", e); }
  finally{ btn.disabled=false; setTimeout(()=>setState(""),2500); }
}
async function doDelete(i){
  if(!window.confirm("确定删除短信 #"+i+" ？")) return;
  try{
    const r = await fetch(API+"?action=sms_delete&index="+encodeURIComponent(i)+"&ts="+Date.now(), {cache:"no-store"});
    const d = await r.json();
    if(!d || d.ok!==true) throw new Error("删除失败");
    if(Array.isArray(d.messages)) messages=d.messages; else messages=messages.filter(m=>String(m.index)!==String(i));
    render(); setState("短信已删除");
    setTimeout(()=>setState(""),2000);
  }catch(e){ setState("删除失败，请稍后重试", "error"); console.error("sms_delete", e); }
}
async function doDeleteAll(){
  if(!window.confirm("确定删除全部短信？（模组存储将彻底清空，不可恢复）")) return;
  const btn=$("#btnDelAll"); btn.disabled=true; setState("正在删除全部短信...");
  try{
    const r = await fetch(API+"?action=sms_delete_all&ts="+Date.now(), {cache:"no-store"});
    const d = await r.json();
    if(!d || d.ok!==true) throw new Error("删除失败");
    messages = Array.isArray(d.messages)? d.messages : [];
    render(); setState("已删除全部短信");
    setTimeout(()=>setState(""),2500);
  }catch(e){ setState("删除失败，请稍后重试", "error"); console.error("sms_delete_all", e); }
  finally{ btn.disabled=false; }
}
document.addEventListener("click", ev=>{
  if(ev.target.matches("[data-del]")){ doDelete(ev.target.getAttribute("data-del")); return; }
  const head = ev.target.closest(".sms-item-head");
  if(head){ const item=head.closest(".sms-item"); const body=item.querySelector(".sms-detail"); body.hidden=!body.hidden; }
});
$("#btnRefresh").addEventListener("click", doRefresh);
$("#btnStatus").addEventListener("click", loadStatus);
$("#btnDelAll").addEventListener("click", doDeleteAll);
loadStatus();
setInterval(loadStatus, 30000); // 自动每30秒临时读取缓存（只调 sms_status，不触发 AT）
</script>
</body>
</html>
