<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>拨号 · FM170</title>
<style>
:root{color-scheme:dark;--bg:#070708;--panel:#101013;--panel-2:#151519;--panel-3:#1a1a1f;--line:#24242a;--line-soft:#1c1c21;--text:#f5f6f7;--muted:#92959d;--subtle:#5c5f68;--good:#34c45f;--good-soft:rgba(52,196,95,.14);--warn:#e8913f;--warn-soft:rgba(232,145,63,.14);--bad:#ef5a5a;--bad-soft:rgba(239,90,90,.14);--radius:8px}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.page{max-width:640px;margin:0 auto;padding:16px 14px 96px}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:54px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.topbar h1{margin:0;font-size:19px;font-weight:720}
.actions{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);color:var(--text);font-weight:620}
.btn-start{border-color:rgba(52,196,95,.4);background:var(--good-soft);color:var(--good)}
.btn-start:hover{background:rgba(52,196,95,.22)}
.btn-stop{border-color:rgba(239,90,90,.4);background:var(--bad-soft);color:var(--bad)}
.btn-stop:hover{background:rgba(239,90,90,.22)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.status{display:flex;align-items:center;gap:10px;margin:16px 0;padding:16px;border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--panel-2)}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.dot.on{background:var(--good);box-shadow:0 0 10px var(--good)}
.dot.off{background:var(--subtle)}
.status-txt{flex:1}
.status-title{font-weight:720;font-size:15px}
.status-sub{color:var(--muted);font-size:13px;margin-top:2px}
.card{border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--panel-2);margin:12px 0;overflow:hidden}
.card-head{padding:12px 14px;font-weight:700;border-bottom:1px solid var(--line-soft)}
.card-body{padding:12px 14px}
.info-row{display:flex;gap:10px;margin-bottom:8px}
.info-row .k{color:var(--subtle);flex:0 0 90px}
.info-row .v{color:var(--text);min-width:0;word-break:break-all}
.state{display:block;margin:12px 0;padding:10px 14px;border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--panel-2);color:var(--muted);text-align:center}
.state.error{border-color:rgba(239,90,90,.28);background:var(--bad-soft);color:#ffb0b0}
.state.good{border-color:rgba(52,196,95,.28);background:var(--good-soft);color:#9ef0b8}
.note{color:var(--subtle);font-size:12px;margin-top:4px;line-height:1.5}
/* AT 命令区 */
.at-grid{display:flex;flex-direction:column;gap:8px}
.at-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--panel-3)}
.at-item .at-cmd{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--good);flex:1;min-width:0}
.at-item .at-label{color:var(--subtle);font-size:12px;flex:0 0 78px}
.at-item .at-btn{min-height:34px;padding:5px 14px;font-size:13px}
.at-out{width:100%;min-height:140px;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-3);color:#c9d1d9;font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word}
.cmd-warn{color:#ffb0b0;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <h1>网络拨号</h1>
    <button class="btn" id="btnRefresh" type="button">刷新状态</button>
  </div>
  <div class="actions">
    <button class="btn btn-start" id="btnStart" type="button">打开拨号</button>
    <button class="btn btn-stop" id="btnStop" type="button">关闭拨号</button>
  </div>
  <div class="actions" style="margin-top:0;align-items:center">
    <label for="inApn" style="color:var(--muted);font-size:13px;flex:0 0 auto">APN（留空=自动）</label>
    <input id="inApn" type="text" value="auto" placeholder="auto"
      style="flex:1;min-width:0;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-3);color:var(--text);font-size:14px"/>
    <span style="color:var(--subtle);font-size:12px">换特殊卡可手填固定 APN</span>
  </div>
  <button class="btn btn-stop" id="btnQmodemStop" type="button" style="width:100%;margin-bottom:8px">彻底停止 qmodem 拨号</button>
  <div class="actions" style="margin-top:14px">
    <button class="btn btn-stop" id="btnSchedStop" type="button">关闭串口调度器</button>
    <button class="btn btn-start" id="btnSchedStart" type="button">打开串口调度器</button>
  </div>
  <div id="state"></div>
  <div class="status" id="statusBox">
    <span class="dot" id="statusDot"></span>
    <div class="status-txt">
      <div class="status-title" id="statusTitle">检测中</div>
      <div class="status-sub" id="statusSub"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-head">连接信息</div>
    <div class="card-body" id="connInfo">
      <div class="info-row"><span class="k">拨号进程</span><span class="v" id="infPid">--</span></div>
      <div class="info-row"><span class="k">网络接口</span><span class="v" id="infNet">--</span></div>
      <div class="info-row"><span class="k">IPv4 地址</span><span class="v" id="infIp">--</span></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">常用 AT 指令</div>
    <div class="card-body">
      <div class="at-grid">
        <div class="at-item">
          <span class="at-label">查询小区</span>
          <span class="at-cmd">AT+GTCCINFO?</span>
          <button class="btn at-btn btn-start" id="btnCcInfo" type="button">查询</button>
        </div>
        <div class="at-item">
          <span class="at-label">锁小区状态</span>
          <span class="at-cmd">AT+GTCELLLOCK?</span>
          <button class="btn at-btn btn-start" id="btnCellLock" type="button">查询</button>
        </div>
        <div class="at-item">
          <span class="at-label">复位模组</span>
          <span class="at-cmd">AT+CFUN=15</span>
          <button class="btn at-btn" id="btnCfun15" type="button" style="border-color:var(--warn);color:var(--warn)">复位</button>
        </div>
      </div>
      <div class="cmd-warn">复位模组会重新读卡，可能短暂断网，请谨慎操作。</div>
      <textarea class="at-out" id="atOut" readonly placeholder="AT 指令执行结果将显示在这里"></textarea>
    </div>
  </div>

  <div class="note">
    说明：本页使用独立拨号（quectel-CM，QMI），不影响 qmodem 配置。<br/>
    打开拨号：启动 QMI 拨号，自动获取 APN 与 IP。<br/>
    关闭拨号：断开数据连接，关闭后不会自动重连，需手动再打开。<br/>
    AT 指令走串口调度器管理，无需登录，点击即可查询。
  </div>
</div>
<script>
const API = "/cgi-bin/fm170_dial.cgi";
const $ = s => document.querySelector(s);
function setState(msg, cls){ const el=$("#state"); if(!msg){el.style.display="none";return;} el.style.display="block"; el.className="state"+(cls?" "+cls:""); el.textContent=msg; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function render(data){
  const on = !!(data && data.dialing);
  const dot=$("#statusDot"), title=$("#statusTitle"), sub=$("#statusSub");
  const hasIp = !!(data && data.ipv4);
  if(!data){ dot.className="dot off"; title.textContent="未知"; sub.textContent="状态获取失败"; }
  else if(on && hasIp){ dot.className="dot on"; title.textContent="已拨号"; sub.textContent="数据连接处于活动状态，IP: " + esc(data.ipv4); }
  else if(on && !hasIp){ dot.className="dot on"; title.textContent="已拨号（等待获取 IP）"; sub.textContent="拨号进程已启动，正在等待运营商分配 IP..."; }
  else { dot.className="dot off"; title.textContent="未拨号"; sub.textContent="数据连接未开启"; }
  $("#infPid").textContent = data && data.pid ? esc(data.pid) : "--";
  $("#infNet").textContent = data && data.netcard ? esc(data.netcard) : "--";
  $("#infIp").textContent = hasIp ? esc(data.ipv4) : (on ? "等待获取 IP..." : "--");
}
async function loadStatus(){
  try{
    const r=await fetch(API+"?action=ppp_status&ts="+Date.now(),{cache:"no-store"});
    if(!r.ok){ renderFail("HTTP "+r.status); return; }
    const d=await r.json();
    if(d&&d.ok) render(d); else { renderFail(d&&d.error?("接口:"+d.error):"ok=false"); }
  }catch(e){ renderFail(e&&e.message?e.message:String(e)); console.error("ppp_status",e); }
}
// 诊断辅助：把失败原因显示在状态区，便于定位
function renderFail(msg){
  const dot=$("#statusDot"), title=$("#statusTitle"), sub=$("#statusSub");
  dot.className="dot off"; title.textContent="状态获取失败";
  sub.innerHTML="<span style='color:#ffb0b0;word-break:break-all'>"+esc(msg||"未知错误")+"</span>";
}
async function doStart(){
  const btn=$("#btnStart"); btn.disabled=true; setState("正在打开拨号...");
  try{
    const apn=($("#inApn").value||"").trim()||"auto";
    const r=await fetch(API+"?action=ppp_start&apn="+encodeURIComponent(apn)+"&ts="+Date.now(),{cache:"no-store"});
    const d=await r.json();
    if(!d||d.ok!==true) throw new Error(d?.error||"拨号启动失败");
    setState(d.message||"拨号已启动","good");
    setTimeout(loadStatus,1800);
  }catch(e){ setState(e.message||"拨号启动失败","error"); console.error("ppp_start",e); }
  finally{ btn.disabled=false; }
}
async function doStop(){
  const btn=$("#btnStop"); btn.disabled=true; setState("正在关闭拨号...");
  try{
    const r=await fetch(API+"?action=ppp_stop&ts="+Date.now(),{cache:"no-store"});
    const d=await r.json();
    if(!d||d.ok!==true) throw new Error(d?.error||"拨号关闭失败");
    setState(d.message||"拨号已关闭","good");
    setTimeout(loadStatus,1500);
  }catch(e){ setState(e.message||"拨号关闭失败","error"); console.error("ppp_stop",e); }
  finally{ btn.disabled=false; }
}
async function doQmodemStop(){
  const c=window.confirm("确定彻底停止 qmodem 拨号？\n将执行 hang + enable_dial=0 + 禁自启，会断开蜂窝网络。");
  if(!c) return;
  const btn=$("#btnQmodemStop"); btn.disabled=true; setState("正在停止 qmodem 拨号...");
  try{
    const r=await fetch(API+"?action=qmodem_stop&ts="+Date.now(),{cache:"no-store"});
    const d=await r.json();
    if(!d||d.ok!==true) throw new Error(d?.error||"停止失败");
    setState(d.message||"已停止","good");
  }catch(e){ setState(e.message||"停止失败","error"); }
  finally{ btn.disabled=false; setTimeout(loadStatus,1500); }
}
async function doSchedStop(){
  if(!window.confirm("关闭串口调度器？将停止 fm170_scheduler，WebUI 状态/扫描停止刷新。")) return;
  setState("正在关闭串口调度器...");
  try{
    const r=await fetch(API+"?action=scheduler_stop&ts="+Date.now(),{cache:"no-store"}); const d=await r.json();
    if(!d||d.ok!==true) throw new Error(d?.error||"关闭失败");
    setState(d.message||"已关闭","good");
  }catch(e){ setState(e.message||"关闭失败","error"); }
}
async function doSchedStart(){
  setState("正在打开串口调度器...");
  try{
    const r=await fetch(API+"?action=scheduler_start&ts="+Date.now(),{cache:"no-store"}); const d=await r.json();
    if(!d||d.ok!==true) throw new Error(d?.error||"打开失败");
    setState(d.message||"已启动","good");
  }catch(e){ setState(e.message||"打开失败","error"); }
}
// ---- AT 指令（无需登录，走 dial.cgi 的 at action）----
function out(txt){ $("#atOut").value = txt; }
async function doAt(cmd, label){
  setState("正在执行 "+label+"...");
  try{
    const r=await fetch(API+"?action=at&cmd="+encodeURIComponent(cmd)+"&ts="+Date.now(),{cache:"no-store"});
    const d=await r.json();
    if(!d||d.ok!==true) throw new Error(d?.error||label+" 执行失败");
    const raw=(d.raw||"").replace(/\r/g,"");
    out("◆ "+label+"\n"+raw.trim()+"\n");
    setState(label+" 执行成功","good");
  }catch(e){ setState(e.message||label+" 失败","error"); console.error(label,e); }
}
$("#btnRefresh").addEventListener("click",loadStatus);
$("#btnStart").addEventListener("click",doStart);
$("#btnStop").addEventListener("click",doStop);
$("#btnQmodemStop").addEventListener("click",doQmodemStop);
$("#btnSchedStop").addEventListener("click",doSchedStop);
$("#btnSchedStart").addEventListener("click",doSchedStart);
$("#btnCcInfo").addEventListener("click",()=>doAt("AT+GTCCINFO?","当前小区 (AT+GTCCINFO?)"));
$("#btnCellLock").addEventListener("click",()=>doAt("AT+GTCELLLOCK?","锁小区状态 (AT+GTCELLLOCK?)"));
$("#btnCfun15").addEventListener("click",()=>{
  if(!window.confirm("确定执行 AT+CFUN=15 复位模组？\n会重新读卡，可能短暂断网。")) return;
  doAt("AT+CFUN=15","复位模组 (AT+CFUN=15)");
});
loadStatus();
setInterval(loadStatus,5000);
</script>
</body>
</html>
